---
id: Utility_Shutoff_Prevention_Form
continue button field: utility_shutoff_prevention_form_intro
question: |
  Utility shutoff prevention letter
subquestion: |
  This interview helps Massachusetts clinicians write to a utility company. It asks the company to keep or restore service for a patient’s household.

  Before you start, gather:

  1. Your patient's address.
  2. The utility company name and address.
  3. The utility account number, if you have it.

  After you finish, you must:

  1. Tell the utility company about the serious illness. Someone acting for the customer can also call.
  2. Print the letter.
  3. If the utility was told about the illness by phone, send the written certification within 7 days of that call.

  Most people take about 10 minutes to finish this interview.
---
id: clinician eligibility
question: |
  Are you a doctor, nurse practitioner, or physician assistant in Massachusetts?
fields:
  - I am a Massachusetts clinician and I need this letter: is_ma_clinician
    datatype: yesnoradio
---
id: not_ma_clinician_exit_screen
event: not_ma_clinician_exit_screen
question: |
  This form is only for Massachusetts clinicians
subquestion: |
  This letter is for doctors, nurse practitioners, and physician assistants in Massachusetts.

  A local board of health can also certify a serious illness under the DPU rule.
  For other certification options and model letters, see:

  [Mass Legal Help](https://www.masslegalhelp.org/public-benefits-ssi/utilities-other-benefits/stop-your-heat-and-electricity-getting-shut).

buttons:
  - Exit: exit
---
id: patient illness eligibility
question: |
  Does your patient have a serious or chronic illness?
subquestion: |
  Use your clinical judgment. See [Massachusetts utility shutoff protections](https://www.mass.gov/doc/billing-and-termination-regulations-0/download) for the rule that applies to this letter.
fields:
  - My patient has a serious or chronic illness: has_qualifying_illness
    datatype: yesnoradio
---
id: Call Utility Company Info Page
continue button field: call_utility_company_info_page
question: |
  Call the utility company first
subquestion: |
  You or someone acting for the customer can call the utility to report the serious illness.
  Share the patient’s name and address. Send the written certification within 7 days of the call.

  The customer may also need to return a financial hardship form within 7 days of receiving it.
  See [Massachusetts Legal Help’s shutoff guide](https://www.masslegalhelp.org/public-benefits-ssi/utilities-other-benefits/stop-your-heat-and-electricity-getting-shut) for hardship and renewal steps.

  If the company does not honor the notice, call the DPU Consumer Division.
  Call [(617) 737-2836](tel:+16177372836) or [(877) 886-5066](tel:+18778865066).
---
id: User's name
question: |
  What is your name?
fields:
  - First name: users[0].name.first
  - Middle name: users[0].name.middle
    required: False
  - Last name: users[0].name.last
  - Suffix: users[0].name.suffix
    required: False
---
id: user i's address
question: |
  What is your work address?
fields:
  - label: |
      % if i > 0 and al_person_answering == "user":
      Same as your address
      % else:
      Same as ${ users[0] }'s address
      % endif
    field: users[i].address
    datatype: object_radio
    choices:
      - users[0].address if defined("users[0].address.address") else None
    object labeler: |
      lambda y: y.on_one_line()      
    none of the above: |
      Somewhere else
    disable others: True
    show if:
      code: |
        i > 0 and defined("users[0].address.address")
  - ${ users[i].address.address_label}: users[i].address.address
    address autocomplete: True
  - ${ users[i].address.unit_label}: users[i].address.unit
    required: False
  - ${ users[i].address.city_label}: users[i].address.city
  - ${ users[i].address.state_label}: users[i].address.state
    code: |
      states_list(country_code=AL_DEFAULT_COUNTRY)
    default: ${ AL_DEFAULT_STATE }
  - ${ users[i].address.zip_label}: users[i].address.zip
    required: False
#  - ${ users[i].address.country_label}: users[i].address.country
#    code: countries_list()
#    default: ${ AL_DEFAULT_COUNTRY }
---
id: "tell us about your job"
question: |
  Tell us about your job 
fields:
  - "Employer name": users[0].business_name
  - "Job title": users[0].job_title
    datatype: radio
    choices:
      - Doctor: doctor
      - Nurse practitioner: nurse practitioner
      - Physician assistant: physician assistant
  
---
id: Patient's utility account number
question: |
  Patient's utility account number
fields:
  - "Do you know the patient's account number?": knows_utility_account_number
    datatype: yesnoradio 
  - "Patient's utility account number": plaintiffs[0].account_number
    show if: knows_utility_account_number
---
id: Users Contact Info
question: |
  What is your work phone number?
subquestion: |
  The utility company needs a phone number for your office. You can also give a work email address.
fields: 
  - "Email address": users[0].email
    datatype: email
    required: False
  - "Work phone number": users[0].mobile_number
    datatype: al_phone
validation code: |
  if not phone_number_is_valid(users[0].mobile_number):
    validation_error("Enter a valid work phone number, including the area code.", field="users[0].mobile_number")
---
id: Patient Name
question: |
  What is your patient's name?
fields:
  - Patient first name: plaintiffs[0].name.first
  - Patient middle name: plaintiffs[0].name.middle
    required: False
  - Patient last name: plaintiffs[0].name.last
  - Suffix (if applicable): plaintiffs[0].name.suffix
    required: False
---
id: Today's Date
question: |
  When are you sending this letter? 
fields:
  - "Date of the letter": certification_date
    datatype: date
    default: ${ showifdef("_date") or today() }
---
id: Utility Company Name
question: |
  What is the utility company’s name?
fields:
  - "Name of the utility company": other_parties[0].business_name
--- 
id: Utility Company Address
question: |
  What is the utility company’s mailing address?
fields:
  - code: |
      other_parties[0].address_fields(default_state=AL_DEFAULT_STATE)
---
code: | 
  other_parties[0].name.first = other_parties[0].business_name
---
id: medical certification
question: |
  What illness are you certifying?
subquestion: |
  The DPU rule asks for the nature of the illness. Give only the medical detail needed for this certification.
  If you leave this field blank, fill in the missing information in the letter before sending it.
continue button field: medical_certification_reviewed
fields:
  - Illness type: certified_illness_type
    datatype: radio
    choices:
      - Serious illness: serious
      - Chronic serious illness: chronic
  - Nature of the illness: nature_of_illness
    input type: area
    rows: 2
    required: False
---
id: illness_exit_screen
event: illness_exit_screen
question: |
  This form is only for patients with a serious or chronic illness
subquestion: |
  You said the patient does not have a serious or chronic illness.

  If you chose "No" by mistake, go back to change your answer.

  To learn more about statutory protections, read [Massachusetts utility shutoff protections](https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXXII/Chapter164/Section124a).

  For more general information, visit [Mass.gov](https://www.mass.gov/regulations/220-CMR-2500-billing-and-termination-procedures-of-the-department-of-public-utilities)
 
buttons:
  - Exit: exit
---
id: preview utility_shutoff_prevention_form
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_utility_shutoff_prevention_form'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: utility_shutoff_prevention_form_preview_question    
---
code: |
  signature_fields = ['users[0].signature']
---
id: utility shutoff prevention form review screen
event: review_utility_shutoff_prevention_form
question: |
  Review your answers
review:
  - Edit: users[0].job_title
    button: |
      **Your role and employer**: ${ users[0].job_title }, ${ users[0].business_name }
  - Edit: users[0].address.address
    button: |
      **Your work address**: ${ users[0].address.on_one_line() }
  - Edit: users[0].mobile_number
    button: |
      **Your work phone number**: ${ users[0].mobile_number }
  - Edit: certified_illness_type
    button: |
      **Illness type**: ${ "Chronic serious illness" if certified_illness_type == "chronic" else "Serious illness" }

      **Nature of illness**: ${ nature_of_illness or "Fill in before sending" }
  - Edit: users[0].name.first
    button: |
      **Certifying clinician**: ${ users[0].name.full() }
  - Edit: certification_date
    button: |
      **Letter date**:
      ${ certification_date }
  - Edit: knows_utility_account_number
    button: |
      **Patient’s utility account number**: ${ plaintiffs[0].account_number if knows_utility_account_number else "Not entered" }
  - Edit: plaintiffs[0].name.first
    button: |
      **Patient**: ${ plaintiffs[0].name.full() }
  - Edit: plaintiffs[0].address.address
    button: |
      **Patient’s address**: ${ plaintiffs[0].address.on_one_line() }
  - Edit: other_parties[0].business_name
    button: |
      **Utility company**: ${ other_parties[0].business_name }
  - Edit: other_parties[0].address.address
    button: |
      **Utility company mailing address**: ${ other_parties[0].address.on_one_line() }
---
id: download utility_shutoff_prevention_form
event: utility_shutoff_prevention_form_download
question: |
  All done
subquestion: |
  Thank you ${ users }. Review the letter before sending it.
  % if not nature_of_illness:
  Fill in the nature of the illness in the letter before you send it.
  % endif
  
  Download the letter below. Click "Edit answers" to fix any mistakes.

  ${ action_button_html(url_action('review_utility_shutoff_prevention_form'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  



