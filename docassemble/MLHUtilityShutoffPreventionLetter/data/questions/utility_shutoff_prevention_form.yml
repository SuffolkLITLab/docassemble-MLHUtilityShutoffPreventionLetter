metadata:
  title: Medical letter to stop a utility shutoff
  short title: Utility shutoff prevention letter
  description: >-
    Massachusetts doctors, nurse practitioners, and physician assistants can use this letter
    to certify a serious illness. It asks the utility company to stop a gas or electricity
    shutoff or restore service to the patient’s household.
  can_I_use_this_form: |
    Use this interview if you are a Massachusetts doctor, nurse practitioner, or physician assistant
    writing for a patient with a serious illness. The paper form linked here is for a serious and chronic illness.
    The help guide explains other options.
  before_you_start: |
    Have your work phone number, the patient’s address, and the utility company’s mailing address.
    Include the account number if you have it.
  when_you_are_finished: |
    Review and sign the letter. Send it to the utility company.
    If the utility first learned about the illness by phone, send the letter within seven days of that call.
    The customer may also need to send a financial hardship form.
